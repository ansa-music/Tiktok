<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// SCALE #7: from Earth to Betelgeuse, then Betelgeuse dropped in place of the Sun.
const LIME = '#C8FF2E', INK = '#F4F4F0', MUTED = '#9A9A92';
// [name, line under it, colour core, colour rim, width relative to previous body]
const BODIES = [
  ['EARTH', 'Our home', '#5fb0ff', '#1b4f9c', 1],
  ['JUPITER', '11× wider than Earth', '#e8c39a', '#9a6a3c', 11],
  ['THE SUN', '109× wider than Earth', '#fff1a8', '#ff9a1f', 9.9],
  ['SIRIUS', 'Brightest star in our sky · 1.7× the Sun', '#e8f4ff', '#7fb8ff', 1.7],
  ['BETELGEUSE', 'Over 600× wider than the Sun', '#ff9a6a', '#c0261c', 380],
];
const T0 = 2.4, SEG = 3.0, R = 300, CY = 1080;
window.DURATION = T0 + SEG * BODIES.length + 7.4;
const STARS = (() => { const r = rng(4); return Array.from({ length: 260 }, () => ({ x: r() * W, y: r() * H, s: .5 + r() * 2.2, p: r() * 6 })); })();

function space(t) {
  ctx.fillStyle = '#04030a'; ctx.fillRect(0, 0, W, H);
  STARS.forEach(s => { ctx.globalAlpha = .4 + .4 * Math.sin(t * 2 + s.p); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); });
  ctx.globalAlpha = 1;
}
function body(i, x, y, r, t, a = 1) {
  if (r < .8) return;
  const [, , core, rim] = BODIES[i];
  ctx.save(); ctx.globalAlpha = a;
  if (i >= 2) {                                        // stars glow
    const g = ctx.createRadialGradient(x, y, r * .6, x, y, r * 1.9); g.addColorStop(0, core + 'aa'); g.addColorStop(1, core + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, Math.PI * 2); ctx.fill();
  }
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); g.addColorStop(0, core); g.addColorStop(1, rim);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (i === 1 && r > 20) {                             // Jupiter bands
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip(); ctx.fillStyle = 'rgba(150,90,50,.35)';
    for (let k = -3; k <= 3; k++) ctx.fillRect(x - r, y + k * r * .22, r * 2, r * .08); ctx.restore();
  }
  if (i === 4 && r > 40) {                             // boiling surface of a red supergiant
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip(); const q = rng(9);
    for (let k = 0; k < 40; k++) { ctx.fillStyle = `rgba(255,${120 + q() * 80},60,${.15 + .1 * Math.sin(t * 2 + k)})`; ctx.beginPath(); ctx.arc(x + (q() - .5) * 2 * r, y + (q() - .5) * 2 * r, r * (.1 + q() * .25), 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
}
function txt(s, x, y, size, col, weight = 900, fam = '"Inter Display", Inter, sans-serif', a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${fam}`; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}

window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textAlign = 'center';
  space(t);
  if (t < T0) {                                         // hook
    const pulse = 1 + .04 * Math.sin(t * 5);
    body(4, W / 2, CY + 120, 380 * pulse, t);
    const k = easeOut(seg(t, .05, .5));
    txt('THIS STAR', W / 2, 470, 130, INK, 900, undefined, k);
    txt('WILL EXPLODE.', W / 2, 600, 130, '#ff6a4a', 900, undefined, k);
    txt('How big is it?', W / 2, 700, 46, MUTED, 600, '"JetBrains Mono", monospace', easeOut(seg(t, .8, 1.2)));
  } else if (t < T0 + SEG * BODIES.length) {            // size ladder
    const i = Math.floor((t - T0) / SEG), lt = t - T0 - i * SEG, ratio = BODIES[i][4];
    const z = ease(seg(lt, 0, 1));                      // camera pulls back: previous body shrinks by the ratio
    // the pair (current + previous) is scaled to fit the frame width
    const fit = i > 0 ? Math.min(1, (W - 160) / (2 * R + 40 + 2 * R / ratio)) : 1;
    const rCur = lerp(R / ratio * (i ? 1 : .2), R, z) * fit, rPrev = Math.max(rCur / ratio, 2.5);
    const total = i > 0 ? 2 * rCur + 40 + 2 * rPrev : 2 * rCur, x0 = W / 2 - total / 2;
    const cxCur = x0 + rCur, px = x0 + 2 * rCur + 40 + rPrev;
    if (i > 0) body(i - 1, px, CY, rPrev, t);
    body(i, cxCur, CY, rCur, t);
    if (i > 0) { const k = easeOut(seg(lt, .9, 1.3)); ctx.globalAlpha = k; ctx.strokeStyle = MUTED; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px, CY + rPrev + 20); ctx.lineTo(px, CY + rPrev + 100); ctx.stroke();
      txt(BODIES[i - 1][0].toLowerCase(), px, CY + rPrev + 140, 36, MUTED, 600, '"JetBrains Mono", monospace', k); ctx.globalAlpha = 1; }
    const k = easeOut(seg(lt, .4, .8));
    ctx.save(); ctx.translate(W / 2, 380); const s = .85 + .15 * k; ctx.scale(s, s);
    txt(BODIES[i][0], 0, 0, 120, i === 4 ? '#ff6a4a' : INK, 900, undefined, k);
    txt(BODIES[i][1], 0, 90, 46, LIME, 700, undefined, k);
    ctx.restore();
    flash(.25 * clamp(1 - lt * 5));
  } else {                                              // payoff: Betelgeuse in place of the Sun
    const lt = t - T0 - SEG * BODIES.length;
    // solar system scale: 1 AU = 120 px. Betelgeuse radius ≈ 3.5 AU (≈760 solar radii).
    const AU = 88, cx = W / 2, cy = CY;
    const grow = ease(seg(lt, .8, 2.6));
    body(4, cx, cy, 3.5 * AU * grow, t, .92);
    const orbits = [['Mercury', .39], ['Venus', .72], ['Earth', 1], ['Mars', 1.52], ['Jupiter', 5.2]];
    orbits.forEach(([n, a], k) => { ctx.strokeStyle = n === 'Jupiter' ? 'rgba(232,195,154,.6)' : 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, a * AU, 0, Math.PI * 2); ctx.stroke();
      const ang = -1.2 + k * .55; ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * a * AU, cy + Math.sin(ang) * a * AU, 7, 0, Math.PI * 2); ctx.fill(); });
    txt('Jupiter', cx, cy - 5.2 * AU - 20, 34, '#e8c39a', 700, '"JetBrains Mono", monospace');
    txt('Mars', cx + 1.52 * AU + 60, cy + 12, 30, INK, 700, '"JetBrains Mono", monospace', 1 - grow);
    const k1 = easeOut(seg(lt, .1, .5)), k2 = easeOut(seg(lt, 2.7, 3.1)), k3 = easeOut(seg(lt, 4.4, 4.8));
    txt('PUT IT WHERE', W / 2, 300, 90, INK, 900, undefined, k1);
    txt('THE SUN IS…', W / 2, 400, 90, INK, 900, undefined, k1);
    ctx.fillStyle = 'rgba(4,3,10,.7)'; ctx.globalAlpha = k2; ctx.fillRect(0, 1580, W, 240); ctx.globalAlpha = 1;
    txt('It swallows Mercury, Venus,', W / 2, 1650, 54, INK, 800, undefined, k2);
    txt('Earth AND Mars.', W / 2, 1720, 54, LIME, 900, undefined, k2);
    txt('One day it will explode.', W / 2, 1790, 44, '#ff6a4a', 700, undefined, k3);
    if (lt > 6.2) flash(.6 * clamp(1 - (lt - 6.2) * 3), '255,200,150');
    txt('AJENT21 · SCALE #7', W / 2, 140, 36, INK, 800, '"JetBrains Mono", monospace', easeOut(seg(lt, 5.4, 5.8)));
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctaPill(t, 8.2, 2.6, 'FOLLOW · NEW SCALE DAILY');
  ctx.textAlign = 'left'; ctx.font = '700 30px "JetBrains Mono", monospace'; ctx.fillStyle = 'rgba(244,244,240,.7)'; ctx.fillText('SCALE #7', 40, 70); ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = LIME; ctx.fillRect(0, 0, W * t / window.DURATION, 10);
  vignette(.45); grain(t);
};
</script></body></html>
