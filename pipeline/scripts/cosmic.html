<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Scale series: the universe's 13.8-billion-year history squeezed into one calendar year.
// 1 day ≈ 37.8 million years, 1 second ≈ 437 years.
const LIME = '#C8FF2E', INK = '#F4F4F0', MUTED = '#9A9A92';
const STARS = (() => { const r = rng(12); return Array.from({ length: 420 }, () => ({ x: r() * W, y: r() * H, z: .2 + r() * .8, tw: r() * 6 })); })();
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

function space(t, warm = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04030a'); g.addColorStop(1, warm ? '#1a0b14' : '#070a18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  STARS.forEach(s => { ctx.globalAlpha = s.z * (.55 + .45 * Math.sin(t * 2 + s.tw)); ctx.fillStyle = '#fff';
    ctx.fillRect((s.x + t * 6 * s.z) % W, s.y, 2.4 * s.z, 2.4 * s.z); });
  ctx.globalAlpha = 1;
}
function txt(s, x, y, size, col = INK, weight = 900, family = '"Inter Display", Inter, sans-serif', alpha = 1) {
  ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${family}`; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function emoji(e, x, y, size, alpha = 1) { ctx.globalAlpha = alpha; ctx.font = `${size}px "Noto Color Emoji"`; ctx.fillText(e, x, y); ctx.globalAlpha = 1; }
// year grid: 3 cols x 4 rows of months, `fill` = fraction of the year elapsed
function yearGrid(fill, hi, a = 1) {
  const cw = 280, ch = 150, gx = 40, gy = 34, x0 = (W - (cw * 3 + gx * 2)) / 2, y0 = 640;
  for (let m = 0; m < 12; m++) {
    const x = x0 + (m % 3) * (cw + gx), y = y0 + Math.floor(m / 3) * (ch + gy);
    const f = clamp(fill * 12 - m);
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x, y, cw, ch);
    ctx.fillStyle = m === hi ? LIME : 'rgba(200,255,46,.35)'; ctx.fillRect(x, y, cw * f, ch);
    ctx.strokeStyle = m === hi ? LIME : 'rgba(255,255,255,.18)'; ctx.lineWidth = m === hi ? 5 : 2; ctx.strokeRect(x, y, cw, ch);
    txt(MONTHS[m], x + cw / 2, y + ch / 2 + 18, 52, f > .5 ? '#0A0A0C' : INK, 800, '"JetBrains Mono", monospace', a);
  }
  ctx.globalAlpha = 1;
}
function decGrid(day, hi, a = 1) {           // December as 31 day cells, `day` = days filled
  const cw = 128, ch = 128, g = 14, x0 = (W - (cw * 7 + g * 6)) / 2, y0 = 640;
  for (let d = 0; d < 31; d++) {
    const x = x0 + (d % 7) * (cw + g), y = y0 + Math.floor(d / 7) * (ch + g), f = clamp(day - d);
    ctx.globalAlpha = a; ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x, y, cw, ch);
    ctx.fillStyle = d + 1 === hi ? LIME : 'rgba(200,255,46,.35)'; ctx.fillRect(x, y + ch * (1 - f), cw, ch * f);
    ctx.strokeStyle = d + 1 === hi ? LIME : 'rgba(255,255,255,.18)'; ctx.lineWidth = d + 1 === hi ? 6 : 2; ctx.strokeRect(x, y, cw, ch);
    txt(String(d + 1), x + cw / 2, y + ch / 2 + 16, 44, f > .5 ? '#0A0A0C' : INK, 800, '"JetBrains Mono", monospace', a);
  }
  ctx.globalAlpha = 1;
}
function card(date, label, em, k, y = 400) {   // big milestone headline with pop-in
  const s = .85 + .15 * easeOut(k);
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
  txt(date, 0, -40, 92, LIME, 900, '"Inter Display", Inter, sans-serif', k);
  txt(label, 0, 50, 64, INK, 800, '"Inter Display", Inter, sans-serif', k);
  ctx.restore();
  if (em) emoji(em, W / 2, y + 220 + (1 - k) * 40, 120, k);
}
function header(a) {
  txt('THE UNIVERSE AS ONE YEAR', W / 2, 170, 46, MUTED, 600, '"JetBrains Mono", monospace', a);
}
function clockFace(h, m, a) {               // 24h dial showing Dec 31
  const cx = W / 2, cy = 1150, R = 330;
  ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 24; i++) { const an = i / 24 * Math.PI * 2 - Math.PI / 2; ctx.fillStyle = i % 6 ? 'rgba(255,255,255,.3)' : INK;
    ctx.fillRect(cx + Math.cos(an) * (R - 30) - 4, cy + Math.sin(an) * (R - 30) - 4, 8, 8); }
  const frac = (h + m / 60) / 24, an = frac * Math.PI * 2 - Math.PI / 2;
  ctx.fillStyle = 'rgba(200,255,46,.25)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R - 10, -Math.PI / 2, an); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = LIME; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(an) * (R - 40), cy + Math.sin(an) * (R - 40)); ctx.stroke();
  ctx.globalAlpha = 1;
}
const pad2 = n => String(n).padStart(2, '0');

// milestones: [start, end, draw]
function s0(t, lt) {                         // hook
  space(t); const k = easeOut(seg(lt, .1, .7));
  const bang = clamp(1 - Math.abs(lt - .25) * 5);
  const g = ctx.createRadialGradient(W / 2, 1150, 1, W / 2, 1150, 700 * bang + 1); g.addColorStop(0, `rgba(255,255,255,${bang})`); g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  txt('IF THE ENTIRE', W / 2, 640, 96, INK, 900, undefined, k);
  txt('UNIVERSE', W / 2, 760, 150, LIME, 900, undefined, k);
  txt('WAS ONE YEAR…', W / 2, 870, 96, INK, 900, undefined, k);
  txt('13.8 billion years → 365 days', W / 2, 1000, 40, MUTED, 500, '"JetBrains Mono", monospace', easeOut(seg(lt, .8, 1.4)));
}
function s1(t, lt) { space(t); header(1); yearGrid(0.002, 0, easeOut(seg(lt, 0, .4))); card('JAN 1', 'The Big Bang', '💥', easeOut(seg(lt, .1, .5)), 330);
  flash(clamp(1 - lt * 4)); }
function s2(t, lt) { space(t); header(1); yearGrid(.011, 0); card('JAN 4', 'First stars ignite', '✨', easeOut(seg(lt, 0, .4)), 330); }
function s3(t, lt) { space(t, 1); header(1); const f = lerp(.011, 243 / 365, ease(seg(lt, 0, 1.6)));
  yearGrid(f, lt > 1.6 ? 8 : -1); card('SEP 1', 'Our Sun is born', '☀️', easeOut(seg(lt, 1.5, 1.9)), 330);
  txt(MONTHS[Math.min(11, Math.floor(f * 12))], W / 2, 1520, 56, MUTED, 600, '"JetBrains Mono", monospace', 1 - seg(lt, 1.5, 1.7)); }
function s4(t, lt) { space(t, 1); header(1); yearGrid(lerp(243 / 365, 264 / 365, ease(seg(lt, 0, .6))), 8); card('SEP 22', 'First life on Earth', '🦠', easeOut(seg(lt, .4, .8)), 330); }
function s5(t, lt) {                       // fast-forward to December
  space(t, 1); header(1);
  const z = ease(seg(lt, .9, 1.5));
  if (z < 1) yearGrid(lerp(264 / 365, 334 / 365, ease(seg(lt, 0, .9))), 11, 1 - z);
  if (z > 0) decGrid(0, -1, z);
  txt('…nothing big happens for months…', W / 2, 400, 44, MUTED, 500, '"JetBrains Mono", monospace', 1 - z);
  txt('ZOOM: DECEMBER', W / 2, 400, 64, LIME, 900, undefined, z);
}
function s6(t, lt) { space(t, 1); header(1); decGrid(lerp(0, 25, ease(seg(lt, 0, .9))), lt > .9 ? 25 : -1); card('DEC 25', 'Dinosaurs appear', '🦖', easeOut(seg(lt, .8, 1.2)), 330); }
function s7(t, lt) { space(t, 1); header(1); camera(1, 0, 0, lt < .5 ? 18 * (1 - lt * 2) : 0, t);
  decGrid(lerp(25, 30, ease(seg(lt, 0, .5))), 30); card('DEC 30', 'Asteroid. Dinosaurs gone.', '☄️', easeOut(seg(lt, .3, .7)), 330);
  flash(.5 * clamp(1 - Math.abs(lt - .45) * 6), '255,140,60'); }
function s8(t, lt) {                       // Dec 31 clock
  space(t, 1); header(1);
  const mins = lerp(0, 23 * 60 + 48, ease(seg(lt, .2, 2)));
  clockFace(Math.floor(mins / 60), mins % 60, easeOut(seg(lt, 0, .3)));
  txt('DEC 31', W / 2, 330, 92, LIME, 900, undefined, 1);
  txt(`${pad2(Math.floor(mins / 60))}:${pad2(Math.floor(mins % 60))}`, W / 2, 1620, 110, INK, 900, '"JetBrains Mono", monospace', 1);
  const k = easeOut(seg(lt, 2, 2.4));
  txt('11:48 PM', W / 2, 520, 80, INK, 900, undefined, k); txt('First humans', W / 2, 600, 60, INK, 800, undefined, k);
  emoji('🧍', W / 2 + 270, 1640, 100, k);
}
function s9(t, lt) {                       // last seconds
  space(t, 1);
  const secs = Math.min(49, Math.floor(lerp(0, 49, ease(seg(lt, 0, 2.2)))));
  const k = easeOut(seg(lt, 2.2, 2.6));
  txt('DEC 31', W / 2, 330, 92, LIME, 900);
  ctx.save(); ctx.translate(W / 2, 980); const pulse = 1 + .05 * k * Math.sin(lt * 10); ctx.scale(pulse, pulse);
  txt(`23:59:${pad2(secs)}`, 0, 0, 170, k > 0 ? LIME : INK, 900, '"JetBrains Mono", monospace');
  ctx.restore();
  txt('ALL OF RECORDED', W / 2, 1260, 84, INK, 900, undefined, k);
  txt('HUMAN HISTORY', W / 2, 1360, 84, INK, 900, undefined, k);
  txt('= the last 11 seconds', W / 2, 1460, 54, MUTED, 600, '"JetBrains Mono", monospace', easeOut(seg(lt, 2.8, 3.2)));
  emoji('🏛️', W / 2 - 180, 1660, 90, k); emoji('🚀', W / 2, 1660, 90, k); emoji('📱', W / 2 + 180, 1660, 90, k);
}
function s10(t, lt) {                      // outro + loop prompt
  space(t); const k = easeOut(seg(lt, 0, .5));
  txt('Every king, war, invention', W / 2, 700, 64, INK, 800, undefined, k);
  txt('and selfie…', W / 2, 790, 64, INK, 800, undefined, k);
  txt('11 SECONDS.', W / 2, 960, 130, LIME, 900, undefined, easeOut(seg(lt, .6, 1)));
  txt('AJENT21', W / 2, 1450, 90, INK, 900, undefined, easeOut(seg(lt, 1.2, 1.6)));
  txt('FOLLOW FOR MORE SCALE', W / 2, 1520, 38, MUTED, 600, '"JetBrains Mono", monospace', easeOut(seg(lt, 1.2, 1.6)));
}
const SHOTS = [[0, 2.6, s0], [2.6, 4.6, s1], [4.6, 6.4, s2], [6.4, 9.2, s3], [9.2, 11.2, s4], [11.2, 13.2, s5], [13.2, 15.6, s6],
  [15.6, 17.8, s7], [17.8, 21.2, s8], [21.2, 25.6, s9], [25.6, 29, s10]];
window.DURATION = 29;
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.textAlign = 'center';
  const s = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
  ctx.save(); s[2](t, t - s[0]); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // progress bar (retention cue)
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = LIME; ctx.fillRect(0, 0, W * t / window.DURATION, 10);
  vignette(.45); grain(t);
  ctaPill(t, 11.4, 2.6, 'FOLLOW · NEW SCALE DAILY');
  ctx.textAlign = 'left'; ctx.font = '700 30px "JetBrains Mono", monospace'; ctx.fillStyle = 'rgba(244,244,240,.7)'; ctx.fillText('SCALE #1', 40, 70); ctx.textAlign = 'center';
};
</script></body></html>
