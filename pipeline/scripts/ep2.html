<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Episode 2: THE RED MOON
function moon(x, y, r, t, crack = 0, eye = 0) {
  const glow = ctx.createRadialGradient(x, y, r * .5, x, y, r * 2.6);
  glow.addColorStop(0, 'rgba(255,60,60,.45)'); glow.addColorStop(1, 'rgba(120,0,20,0)');
  ctx.fillStyle = glow; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
  g.addColorStop(0, '#ff9c8a'); g.addColorStop(.6, '#e8304a'); g.addColorStop(1, '#8c0f2a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(120,10,30,.35)';
  [[-.3, -.2, .18], [.25, .1, .12], [-.05, .35, .1], [.35, -.35, .08]].forEach(([a, b, s]) => { ctx.beginPath(); ctx.arc(x + a * r, y + b * r, s * r, 0, Math.PI * 2); ctx.fill(); });
  if (crack > 0) {
    ctx.save(); ctx.strokeStyle = '#ffe9a8'; ctx.shadowColor = '#ffcf5a'; ctx.shadowBlur = 30; ctx.lineWidth = 6;
    const r2 = rng(3);
    for (let i = 0; i < 7; i++) {
      const a = r2() * Math.PI * 2; ctx.beginPath(); ctx.moveTo(x, y);
      let px = x, py = y;
      for (let j = 1; j <= 5; j++) { px = x + Math.cos(a + (r2() - .5) * .5) * r * j / 5 * crack; py = y + Math.sin(a + (r2() - .5) * .5) * r * j / 5 * crack; ctx.lineTo(px, py); }
      ctx.stroke();
    }
    ctx.restore();
  }
  if (eye > 0) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#1a0006'; ctx.beginPath(); ctx.moveTo(-r * .8, 0); ctx.quadraticCurveTo(0, -r * .7 * eye, r * .8, 0); ctx.quadraticCurveTo(0, r * .7 * eye, -r * .8, 0); ctx.fill();
    ctx.save(); ctx.clip();
    const ig = ctx.createRadialGradient(0, 0, 5, 0, 0, r * .4); ig.addColorStop(0, '#fff7c2'); ig.addColorStop(.4, '#ffcc33'); ig.addColorStop(1, '#a33a00');
    ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(Math.sin(t * 1.3) * r * .08, 0, r * .4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0a0000'; ctx.beginPath(); ctx.ellipse(Math.sin(t * 1.3) * r * .08, 0, r * .06, r * .3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); ctx.restore();
  }
}
function rooftops(col, off = 0, base = 1500) {
  ctx.fillStyle = col;
  const r = rng(21); let x = -300 - off % 400;
  while (x < W + 300) {
    const w = 220 + r() * 220, h = 120 + r() * 380, y = base - h;
    ctx.fillRect(x + w * .15, y, w * .7, H);                         // body
    ctx.beginPath(); ctx.moveTo(x - 40, y + 10); ctx.quadraticCurveTo(x + w * .5, y - 70, x + w + 40, y + 10);   // curved pagoda roof
    ctx.lineTo(x + w * .85, y + 40); ctx.lineTo(x + w * .15, y + 40); ctx.closePath(); ctx.fill();
    if (r() > .4) { ctx.beginPath(); ctx.moveTo(x + w * .1, y - 90); ctx.quadraticCurveTo(x + w * .5, y - 150, x + w * .9, y - 90); ctx.lineTo(x + w * .7, y - 60); ctx.lineTo(x + w * .3, y - 60); ctx.closePath(); ctx.fill(); ctx.fillRect(x + w * .3, y - 70, w * .4, 80); }
    x += w + 30;
  }
}
function lanterns(t, k = 1) {
  const r = rng(31);
  for (let i = 0; i < 14; i++) {
    const x = r() * W, y = 1150 + r() * 600, s = 10 + r() * 10, fl = .7 + .3 * Math.sin(t * 6 + i);
    const g = ctx.createRadialGradient(x, y, 1, x, y, s * 5); g.addColorStop(0, `rgba(255,170,80,${.8 * fl * k})`); g.addColorStop(1, 'rgba(255,90,40,0)');
    ctx.fillStyle = g; ctx.fillRect(x - s * 5, y - s * 5, s * 10, s * 10);
    ctx.fillStyle = `rgba(255,190,110,${fl * k})`; ctx.beginPath(); ctx.ellipse(x, y, s * .7, s, 0, 0, Math.PI * 2); ctx.fill();
  }
}
function ninja(x, y, s, rot, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = '#030306';
  ctx.beginPath(); ctx.ellipse(0, 0, 40, 70, 0, 0, Math.PI * 2); ctx.fill();                 // body tucked
  ctx.beginPath(); ctx.arc(0, -80, 28, 0, Math.PI * 2); ctx.fill();                         // head
  ctx.beginPath(); ctx.moveTo(-30, -20); ctx.lineTo(-110, -60); ctx.lineTo(-100, -40); ctx.lineTo(-30, 10); ctx.fill();   // arm
  ctx.beginPath(); ctx.moveTo(20, 40); ctx.lineTo(90, 110); ctx.lineTo(70, 120); ctx.lineTo(0, 60); ctx.fill();          // leg
  ctx.strokeStyle = '#030306'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(20, -90);      // headband tails
  ctx.quadraticCurveTo(60, -100 + Math.sin(t * 20) * 10, 100, -80 + Math.sin(t * 20 + 1) * 14); ctx.stroke();
  ctx.fillStyle = '#ff2a44'; ctx.fillRect(-16, -86, 12, 4); ctx.fillRect(4, -86, 12, 4);    // eyes
  ctx.restore();
}
function nightSky(t) { sky('#05020c', '#2a0716', '#4a0c1c'); }

function sWide(t, lt) {                         // 0-2.5
  nightSky(t); camera(1 + lt * .05, 0, 0, 0, t);
  moon(W / 2, 760, 330, t); rooftops('#12030a', lt * 20, 1560); lanterns(t);
  rooftops('#050106', lt * 60, 1820); hero(540, 1620, 1.25, t, { rim: '#ff5a5a' });
  petals(t, 'rgba(255,90,110,.75)', 1.5);
}
function sEyes(t, lt) {                         // 2.5-3.4  three pairs of eyes open in darkness
  ctx.fillStyle = '#020104'; ctx.fillRect(0, 0, W, H);
  [[300, 760], [760, 980], [420, 1260]].forEach(([x, y], i) => {
    const k = easeOut(seg(lt, i * .22, i * .22 + .15));
    if (k <= 0) return;
    const g = ctx.createRadialGradient(x, y, 2, x, y, 160); g.addColorStop(0, `rgba(255,30,60,${.5 * k})`); g.addColorStop(1, 'rgba(255,0,40,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 160, y - 160, 320, 320);
    ctx.fillStyle = '#ff2a44';
    [-55, 55].forEach(dx => { ctx.beginPath(); ctx.ellipse(x + dx, y, 40, 9 * k, dx < 0 ? .2 : -.2, 0, Math.PI * 2); ctx.fill(); });
  });
  hLines(t, .15);
}
function sLeap(t, lt) {                         // 3.4-5.6  ninjas leap across the moon, hero draws
  nightSky(t); camera(1.08, 0, 0, 8 + 10 * seg(lt, 0, 2.2), t);
  moon(W / 2, 760, 330, t); rooftops('#12030a', 50, 1560); lanterns(t, .8);
  [[0, -1], [.25, 1], [.5, -1]].forEach(([d, dir]) => {
    const k = seg(lt, d, d + 1.3); if (k <= 0 || k >= 1) return;
    const x = dir > 0 ? lerp(-150, W + 150, k) : lerp(W + 150, -150, k);
    ninja(x, 900 - Math.sin(k * Math.PI) * 420 + d * 200, 1.4, k * 6 * dir, t);
  });
  rooftops('#050106', 60, 1820);
  hero(540, 1620, 1.25, t, { rim: '#ff5a5a', blade: easeOut(seg(lt, 1.2, 2)), crouch: seg(lt, 1.2, 2) * .5 });
  petals(t, 'rgba(255,90,110,.75)', 3);
}
function sCharge(t, lt) {                       // 5.6-6.3
  const k = seg(lt, 0, .7);
  ctx.fillStyle = '#100208'; ctx.fillRect(0, 0, W, H); camera(1 + k * .2, 0, 0, 14, t);
  const g = ctx.createRadialGradient(W / 2, 1100, 50, W / 2, 1100, 900); g.addColorStop(0, `rgba(255,70,90,${.6 * k})`); g.addColorStop(1, 'rgba(60,0,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  radialLines(W / 2, 1000, .5 + .5 * k, t, 'rgba(255,170,180,');
  hero(W / 2, 1750, 2.8, t, { crouch: .9, blade: 1, rim: '#ff8a8a' });
}
function sSlashes(t, lt) {                      // 6.3-8.7  three strikes
  const i = Math.min(2, Math.floor(lt / .8)), l = lt - i * .8;
  const dirs = [[-100, 1700, W + 100, 300], [W + 100, 1600, -100, 500], [-100, 900, W + 100, 1000]];
  if (l < .12) { shotImpactFrame(t, i); return; }
  ctx.fillStyle = ['#1a0410', '#0b0a20', '#200508'][i]; ctx.fillRect(0, 0, W, H);
  camera(1.05, 0, 0, 18 * (1 - l / .8), t);
  hLines(t, .8, i === 1 ? 'rgba(170,200,255,' : 'rgba(255,170,180,');
  const [x1, y1, x2, y2] = dirs[i];
  ninja(W / 2 + (i - 1) * 140, 980, 2.2, .4 * (i - 1) + l * 2, t);
  slash(x1, y1, x2, y2, easeOut(seg(l, .12, .3)), lerp(30, 4, seg(l, .3, .8)));
  // sparks from hit
  const r = rng(40 + i); ctx.fillStyle = '#ffd38a';
  for (let k = 0; k < 70; k++) { const a = r() * 6.28, d = seg(l, .15, .8) * (200 + r() * 600); ctx.globalAlpha = 1 - seg(l, .3, .8); ctx.fillRect(W / 2 + Math.cos(a) * d, 980 + Math.sin(a) * d, 5, 5); }
  ctx.globalAlpha = 1;
}
function shotImpactFrame(t, i) {
  const on = i % 2 === 0;
  ctx.fillStyle = on ? '#fff' : '#000'; ctx.fillRect(0, 0, W, H);
  radialLines(W / 2, H / 2, 1, t, on ? 'rgba(0,0,0,' : 'rgba(255,255,255,', 60);
  ctx.save(); ctx.filter = on ? 'none' : 'invert(1)'; ninja(W / 2, H / 2, 3, .5 * i, t); ctx.restore();
}
function sLand(t, lt) {                         // 8.7-11.2 hero silhouetted against the moon
  nightSky(t); camera(1.15 - lt * .03, 0, 0, Math.max(0, 16 - lt * 12), t);
  moon(W / 2, 980, 520, t); rooftops('#050106', 0, 1860);
  hero(W / 2, 1640, 2.1, t, { rim: '#ffb0a0', blade: 1 - seg(lt, 1.4, 2.2) });
  const r = rng(51);
  for (let k = 0; k < 120; k++) { const x = r() * W, y = (r() * H + lt * 300 * (0.5 + r())) % H; ctx.fillStyle = `rgba(200,20,50,${.8 * r()})`;
    ctx.save(); ctx.translate(x, y); ctx.rotate(lt * 3 + k); ctx.beginPath(); ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  flash(clamp(1 - lt * 3));
}
function sEyeMoon(t, lt) {                      // 11.2-13.6 the moon opens an eye (cliffhanger)
  nightSky(t); camera(1 + seg(lt, 0, 2.4) * .25, 0, -seg(lt, 0, 2.4) * 120, 6 + 30 * seg(lt, .8, 2), t);
  moon(W / 2, 980, 520, t, easeOut(seg(lt, 0, .8)), easeOut(seg(lt, .8, 1.6)));
  rooftops('#050106', 0, 1860);
  hero(W / 2, 1640, 2.1, t, { rim: '#ffd38a', lean: -.05 * seg(lt, 1, 1.4) });
  flash(.35 * Math.max(0, Math.sin(lt * 14)) * seg(lt, 1.6, 2.4), '255,30,60');
}
function sTitle(t, lt) {                        // 13.6-16.5
  nightSky(t); camera(1.25, 0, -120, 3, t);
  moon(W / 2, 980, 520, t, 1, 1); rooftops('#050106', 0, 1860); hero(W / 2, 1640, 2.1, t, { rim: '#ffd38a' });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const k = easeOut(seg(lt, .2, 1));
  ctx.save(); ctx.globalAlpha = k; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(5,5,10,.6)'; ctx.fillRect(0, 230, W, 360);
  ctx.font = '900 150px "Inter Display", Inter, sans-serif'; ctx.fillStyle = '#F4F4F0'; ctx.fillText('AJENT21', W / 2, 420);
  ctx.font = '500 40px "JetBrains Mono", monospace'; ctx.fillStyle = '#C8FF2E'; ctx.fillText('EPISODE 2  ·  THE RED MOON', W / 2, 500);
  ctx.font = '700 44px "JetBrains Mono", monospace'; ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = k * (.6 + .4 * Math.sin(lt * 6)); ctx.fillText('EPISODE 3 →', W / 2, 1520 + 260);
  ctx.restore();
}

const SHOTS = [[0, 2.5, sWide], [2.5, 3.4, sEyes], [3.4, 5.6, sLeap], [5.6, 6.3, sCharge], [6.3, 8.7, sSlashes],
  [8.7, 11.2, sLand], [11.2, 13.6, sEyeMoon], [13.6, 16.5, sTitle]];
window.DURATION = 16.5;
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  const s = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
  ctx.save(); s[2](t, t - s[0]); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sinceCut = t - s[0]; if (s[0] > 0 && sinceCut < .08) flash(.5 * (1 - sinceCut / .08));
  vignette(.6); grain(t); letterbox(t < 13.6 ? 1 : 1 - seg(t, 13.6, 14.2));
  ctaPill(t, 5.6, 2.6, 'FOLLOW FOR EP.3 →');
};
</script></body></html>
