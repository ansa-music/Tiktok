<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script src="lib2.js"></script>
<script>
// Episode 3: THE CHOICE. Ends with an audience vote that decides episode 4.
function beam(x1, y1, x2, y2, w, t, col = '255,40,70') {
  ctx.save(); ctx.lineCap = 'round';
  const jit = 1 + .15 * Math.sin(t * 60);
  ctx.shadowColor = `rgb(${col})`; ctx.shadowBlur = 80;
  ctx.strokeStyle = `rgba(${col},.55)`; ctx.lineWidth = w * 2.6 * jit; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = '#fff2f2'; ctx.lineWidth = w * jit; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}
function portal(x, y, r, t, hot) {
  const c1 = hot ? ['#fff1b0', '#ff8a1e', '#d1131f', '#3a0306'] : ['#e6fbff', '#45d4ff', '#1450d6', '#020a2e'];
  const g = ctx.createRadialGradient(x, y, 5, x, y, r * 1.8);
  g.addColorStop(0, hot ? 'rgba(255,120,40,.55)' : 'rgba(60,170,255,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
  ctx.save(); ctx.translate(x, y); ctx.scale(.62, 1);
  const core = ctx.createRadialGradient(0, 0, 4, 0, 0, r);
  c1.forEach((c, i) => core.addColorStop(i / 3, c));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const rr = r * (.25 + i * .085), a0 = t * (hot ? 2.4 : -2.4) * (1 + i * .12) + i;
    ctx.strokeStyle = i % 2 ? c1[0] : c1[1]; ctx.globalAlpha = .75; ctx.lineWidth = 6 + i;
    ctx.beginPath(); ctx.arc(0, 0, rr, a0, a0 + 1.6 + (i % 3) * .5); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.strokeStyle = c1[1]; ctx.lineWidth = 10; ctx.shadowColor = c1[1]; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
const SHARDS = (() => { const r = rng(61); return Array.from({ length: 46 }, () => ({ a: r() * 6.283, v: 300 + r() * 900, s: 30 + r() * 90, rot: (r() - .5) * 8, k: r() })); })();
function shards(x, y, lt) {
  SHARDS.forEach(p => {
    const d = p.v * lt, px = x + Math.cos(p.a) * d, py = y + Math.sin(p.a) * d + 200 * lt * lt;
    ctx.save(); ctx.translate(px, py); ctx.rotate(p.rot * lt); ctx.globalAlpha = clamp(1.4 - lt * .5);
    ctx.fillStyle = p.k > .5 ? '#e8304a' : '#ff9c8a';
    ctx.beginPath(); ctx.moveTo(0, -p.s); ctx.lineTo(p.s * .6, p.s * .3); ctx.lineTo(-p.s * .5, p.s * .5); ctx.closePath(); ctx.fill(); ctx.restore();
  });
}
const night = t => sky('#05020c', '#2a0716', '#4a0c1c');

function s1(t, lt) {        // 0-1.2 cold open: the eye narrows, beam charges
  night(t); camera(1.35 + lt * .15, 0, -160, 4 + lt * 10, t);
  moon(W / 2, 980, 520, t, 1, 1 - .45 * seg(lt, .3, 1));
  const k = seg(lt, .4, 1.2); const g = ctx.createRadialGradient(W / 2, 980, 4, W / 2, 980, 240 * k + 1);
  g.addColorStop(0, `rgba(255,240,240,${k})`); g.addColorStop(1, 'rgba(255,40,70,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function s2(t, lt) {        // 1.2-3.0 beam strikes the rooftops, hero leaps clear
  night(t); camera(1.05, 0, 0, 30, t);
  moon(W / 2, 600, 300, t, 1, .55); rooftops('#12030a', 0, 1560);
  beam(W / 2, 600, lerp(W / 2, 360, seg(lt, 0, 1.8)), 1650, 46, t);
  const k = easeOut(seg(lt, .1, .8));
  hero(lerp(360, 760, k), 1620 - Math.sin(k * Math.PI) * 520, 1.2, t, { crouch: .6, blade: 1, rim: '#ff8a8a', lean: .4 * Math.sin(k * Math.PI) });
  rooftops('#050106', 0, 1820);
  shards(360, 1600, seg(lt, 0, 1.8) * .8);
  flash(.3 * Math.max(0, Math.sin(lt * 20)), '255,40,70');
}
function s3(t, lt) {        // 3.0-4.6 hero blocks the beam: it splits around the blade
  ctx.fillStyle = '#12020a'; ctx.fillRect(0, 0, W, H); camera(1.1 + lt * .05, 0, 0, 22, t);
  radialLines(W / 2, 760, .8, t, 'rgba(255,150,170,');
  beam(W / 2, -200, W / 2, 760, 60, t);
  beam(W / 2, 760, lerp(W / 2, -200, seg(lt, 0, .6)), 1400, 30, t);
  beam(W / 2, 760, lerp(W / 2, W + 200, seg(lt, 0, .6)), 1400, 30, t);
  hero(W / 2, 1500, 2.4, t, { crouch: .7, blade: 1, rim: '#7fd4ff', lean: -.05 });
  const r = rng(Math.floor(t * 30)); ctx.fillStyle = '#ffe2a0';
  for (let i = 0; i < 90; i++) { const a = -Math.PI / 2 + (r() - .5) * 2.6, d = r() * 600; ctx.fillRect(W / 2 + Math.cos(a) * d, 760 - Math.sin(a) * -d * .5, 6, 6); }
}
function s4(t, lt) {        // 4.6-5.2 impact frames: blade pushes the beam back
  const on = Math.floor(lt * 18) % 2 === 0;
  ctx.fillStyle = on ? '#fff' : '#000'; ctx.fillRect(0, 0, W, H);
  radialLines(W / 2, 700, 1, t, on ? 'rgba(0,0,0,' : 'rgba(255,255,255,', 60);
  ctx.save(); ctx.filter = on ? 'none' : 'invert(1)'; hero(W / 2, 1600, 2.6, t, { crouch: .2, blade: 1, lean: -.25, rim: on ? '#000' : '#fff' }); ctx.restore();
}
function s5(t, lt) {        // 5.2-8.0 moon shatters, the sky tears into two gates
  night(t); camera(1.05 - lt * .02, 0, 0, Math.max(0, 26 - lt * 12), t);
  const k = easeOut(seg(lt, .8, 2.6));
  if (lt < .7) { moon(W / 2, 760, 330, t, 1, .3); beam(W / 2, 1600, W / 2, 760, lerp(60, 10, lt / .7), t, '120,210,255'); }
  else { shards(W / 2, 760, (lt - .7) * .9); }
  if (k > 0) { portal(lerp(W / 2, 270, k), 900, 230 * k, t, true); portal(lerp(W / 2, 810, k), 900, 230 * k, t, false); }
  rooftops('#050106', 0, 1820);
  hero(W / 2, 1650, 1.5, t, { rim: '#ffd38a', blade: 1 });
  flash(clamp(1 - (lt - .7) * 3) * (lt > .7 ? 1 : 0));
}
function s6(t, lt) {        // 8.0-11.0 hero between the gates, looks left, then right
  night(t); camera(1 + lt * .04, 0, 0, 0, t);
  const look = lt < 1.4 ? -1 : 1, pulse = .5 + .5 * Math.sin(t * 5);
  portal(270, 900, 230 + 10 * pulse, t, true); portal(810, 900, 230 + 10 * (1 - pulse), t, false);
  rooftops('#050106', 0, 1820);
  ctx.save(); ctx.translate(W / 2, 1650); ctx.scale(look, 1); ctx.translate(-W / 2, -1650);
  hero(W / 2, 1650, 1.5, t, { rim: look < 0 ? '#ff9a3c' : '#5cc8ff', blade: 1 }); ctx.restore();
  petals(t, look < 0 ? 'rgba(255,150,80,.8)' : 'rgba(120,200,255,.8)', look * 1.5);
}
function s7(t, lt) {        // 11.0-17.0 freeze + the vote
  night(t); camera(1.04, 0, 0, 0, t);
  portal(270, 900, 240, t, true); portal(810, 900, 240, t, false);
  rooftops('#050106', 0, 1820); hero(W / 2, 1650, 1.5, t, { rim: '#ffffff', blade: 1 });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
  const k = easeOut(seg(lt, .1, .6)), k2 = easeOut(seg(lt, .5, 1.1)), k3 = easeOut(seg(lt, 1, 1.6));
  ctx.textAlign = 'center';
  ctx.globalAlpha = k; ctx.font = '900 132px "Inter Display", Inter, sans-serif'; ctx.fillStyle = '#F4F4F0';
  ctx.fillText('YOU DECIDE', W / 2, 380 + (1 - k) * 40);
  ctx.globalAlpha = k2; ctx.font = '120px "Noto Color Emoji"';
  ctx.fillText('🔥', 270, 940); ctx.fillText('🌊', 810, 940);
  ctx.font = '800 54px "Inter Display", Inter, sans-serif';
  ctx.fillStyle = '#ffb35c'; ctx.fillText('FIRE GATE', 270, 1210);
  ctx.fillStyle = '#7fd4ff'; ctx.fillText('TIDE GATE', 810, 1210);
  ctx.globalAlpha = k3 * (.75 + .25 * Math.sin(lt * 6));
  ctx.fillStyle = '#C8FF2E'; ctx.font = '700 46px "JetBrains Mono", monospace';
  ctx.fillText('COMMENT 🔥 OR 🌊', W / 2, 1360);
  ctx.globalAlpha = k3; ctx.fillStyle = '#c9c9c2'; ctx.font = '500 34px "JetBrains Mono", monospace';
  ctx.fillText('EPISODE 4 FOLLOWS THE VOTE', W / 2, 1420);
  ctx.font = '900 64px "Inter Display", Inter, sans-serif'; ctx.fillStyle = '#F4F4F0'; ctx.fillText('AJENT21', W / 2, 1640);
  ctx.font = '500 30px "JetBrains Mono", monospace'; ctx.fillStyle = '#9A9A92'; ctx.fillText('EP.3 · THE CHOICE', W / 2, 1690);
  ctx.globalAlpha = 1;
}
const SHOTS = [[0, 1.2, s1], [1.2, 3.0, s2], [3.0, 4.6, s3], [4.6, 5.2, s4], [5.2, 8.0, s5], [8.0, 11.0, s6], [11.0, 17.0, s7]];
window.DURATION = 17;
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  const s = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
  ctx.save(); s[2](t, t - s[0]); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sinceCut = t - s[0]; if (s[0] > 0 && sinceCut < .08) flash(.5 * (1 - sinceCut / .08));
  vignette(.55); grain(t); letterbox(t < 11 ? 1 : 1 - seg(t, 11, 11.5));
  ctaPill(t, 5.4, 2.4, 'YOU WILL DECIDE EP.4');
};
</script></body></html>
