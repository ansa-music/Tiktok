<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=JetBrains+Mono:wght@600;700;800&display=block">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// SCALE #6: how fast is the ISS. Sources: NASA ISS facts (orbital speed ~17,500 mph = ~28,000 km/h,
// one orbit ~90 min, 16 sunrises/sunsets a day, altitude ~400 km).
// 28,000 km/h / 3600 = 7.8 km/s (NASA mean ~7.66 km/s -> "7.7 km every second").
// Jet airliner cruise ~900 km/h -> 28,000 / 900 = 31 -> "30x faster".
// London-New York great circle 5,570 km / 7.66 km/s = 727 s = 12.1 min -> "12 minutes"; jet at ~800 km/h ground speed ~7 h.
// New York-Los Angeles 3,940 km / 7.66 km/s = 514 s = 8.6 min -> "under 9 minutes".
const LIME = '#C8FF2E', INK = '#F4F4F0', MUTED = '#9A9A92';
const F = '"Inter Display", Inter, "Segoe UI", sans-serif', M = '"JetBrains Mono", Consolas, monospace';
const STARS = (() => { const r = rng(31); return Array.from({ length: 380 }, () => ({ x: r() * W, y: r() * H, z: .2 + r() * .8, tw: r() * 6 })); })();

function space(t, a = 1, drift = 6) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#03040b'); g.addColorStop(1, '#070a18');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  STARS.forEach(s => { ctx.globalAlpha = a * s.z * (.55 + .45 * Math.sin(t * 2 + s.tw)); ctx.fillStyle = '#fff';
    ctx.fillRect(((s.x - t * drift * s.z) % W + W) % W, s.y, 2.4 * s.z, 2.4 * s.z); });
  ctx.globalAlpha = 1;
}
function txt(s, x, y, size, col = INK, weight = 900, family = F, alpha = 1) {
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${family}`; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function glow(x, y, r, col, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${col},${.8 * a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function label(s, x, y, col = INK, size = 40, a = 1) { txt(s, x, y, size, col, 700, M, a); }
const fmt = n => Math.round(n).toLocaleString('en-US');
function headline(a, b, k, y = 300, sub) {
  const s = .85 + .15 * easeOut(k);
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
  txt(a, 0, 0, 104, LIME, 900, F, k); if (b) txt(b, 0, 96, 66, INK, 800, F, k);
  ctx.restore();
  if (sub) txt(sub, W / 2, y + 176, 42, MUTED, 600, M, k);
}
// Earth seen from orbit: big disc below, surface scrolls with t
function earth(t, cy = 2350, R = 1500, speed = 60) {
  glow(W / 2, cy - R, 520, '80,150,255', .55);
  const g = ctx.createRadialGradient(W / 2, cy, R * .6, W / 2, cy, R);
  g.addColorStop(0, '#071a3a'); g.addColorStop(.85, '#12458f'); g.addColorStop(1, '#4aa0ff');
  ctx.save(); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W / 2, cy, R, 0, 6.283); ctx.fill(); ctx.clip();
  const r = rng(77); ctx.fillStyle = 'rgba(70,150,90,.55)';
  for (let i = 0; i < 16; i++) { const x = ((r() * 3000 - t * speed) % 3000 + 3000) % 3000 - 900, y = cy - R + 60 + r() * 600;
    ctx.beginPath(); ctx.ellipse(x, y, 120 + r() * 220, 50 + r() * 90, r() - .5, 0, 6.283); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  for (let i = 0; i < 26; i++) { const x = ((r() * 3000 - t * speed * 1.3) % 3000 + 3000) % 3000 - 900, y = cy - R + 40 + r() * 700;
    ctx.beginPath(); ctx.ellipse(x, y, 80 + r() * 160, 14 + r() * 26, 0, 0, 6.283); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(140,200,255,.7)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(W / 2, cy, R + 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
}
// the station: truss, 4 solar-wing pairs, modules
function iss(x, y, s, rot = 0, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = '#cfd3d8'; ctx.fillRect(-200, -7, 400, 14);                      // truss
  [-170, -120, 120, 170].forEach(px => {
    [-1, 1].forEach(d => {
      const g = ctx.createLinearGradient(px - 18, 0, px + 18, 0); g.addColorStop(0, '#b8862a'); g.addColorStop(.5, '#f2c25a'); g.addColorStop(1, '#a8761e');
      ctx.fillStyle = g; ctx.fillRect(px - 18, d > 0 ? 12 : -132, 36, 120);
      ctx.strokeStyle = 'rgba(60,40,10,.6)'; ctx.lineWidth = 2;
      for (let k = 1; k < 6; k++) { const yy = (d > 0 ? 12 : -132) + k * 20; ctx.beginPath(); ctx.moveTo(px - 18, yy); ctx.lineTo(px + 18, yy); ctx.stroke(); }
    });
  });
  ctx.fillStyle = '#e9ecef'; ctx.fillRect(-14, -70, 28, 140);                       // modules
  ctx.fillRect(-50, 40, 100, 22); ctx.fillStyle = '#aab2bb'; ctx.fillRect(-30, -95, 60, 26);
  ctx.fillStyle = '#f4f4f0'; ctx.fillRect(-90, -30, 26, 60); ctx.fillRect(64, -30, 26, 60);   // radiators
  ctx.restore();
}
function speedLines(k, y0 = 0, y1 = H, col = '255,255,255') {
  if (k <= 0) return;
  const r = rng(Math.floor(k * 999) + 3);
  for (let i = 0; i < 40; i++) { const y = y0 + r() * (y1 - y0), x = r() * W, l = 120 + r() * 380;
    ctx.fillStyle = `rgba(${col},${.08 + .2 * r()})`; ctx.fillRect(x, y, l * k, 3); }
}
function plane(x, y, s, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(0, 0, 60, 9, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-20, -48); ctx.lineTo(-30, -48); ctx.lineTo(-12, 0); ctx.lineTo(-30, 48); ctx.lineTo(-20, 48); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-45, 0); ctx.lineTo(-60, -20); ctx.lineTo(-64, -20); ctx.lineTo(-56, 0); ctx.lineTo(-64, 20); ctx.lineTo(-60, 20); ctx.fill();
  ctx.restore();
}

// ---------- shots ----------
function s0(t, lt) {                         // hook: ISS screams across the Earth limb
  space(t, 1, 40); earth(t, 2350, 1500, 260);
  speedLines(1, 900, 1300);
  const x = lerp(-250, W + 250, (lt / 2.6 + .25) % 1.15);
  glow(x, 1080, 120, '255,220,140', .5); iss(x, 1080, .9, -.08);
  flash(.3 * clamp(1 - lt * 5));
  txt('HOW FAST', W / 2, 340, 130, INK, 900, F, 1);
  txt('IS THE ISS?', W / 2, 480, 130, LIME, 900, F, easeOut(seg(lt, 0, .3)));
  txt('International Space Station', W / 2, 570, 40, MUTED, 600, M, easeOut(seg(lt, .6, 1)));
}
function s1(t, lt) {                         // the number
  space(t, 1, 30); earth(t, 2500, 1500, 200);
  iss(W / 2, 1150, 1.4 + .1 * lt, -.05 + .02 * Math.sin(t * 2));
  const v = lerp(0, 28000, easeOut(seg(lt, 0, 1.4)));
  txt(fmt(v), W / 2, 420, 190, LIME, 900, M, 1);
  txt('km/h', W / 2, 520, 70, INK, 800, M, easeOut(seg(lt, .2, .5)));
  txt('= 17,500 mph', W / 2, 610, 46, MUTED, 600, M, easeOut(seg(lt, 1.2, 1.6)));
}
function s2(t, lt) {                         // 7.7 km every second
  space(t, .8);
  const k = easeOut(seg(lt, 0, .4));
  headline('7.7 km', 'EVERY SECOND', k, 340);
  // a one-second dial; each sweep pushes the bar 7.7 km
  const cx = W / 2, cy = 960, R = 190, sw = lt % 1;
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = LIME; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + sw * 6.283); ctx.stroke();
  txt(`${(sw).toFixed(2)} s`, cx, cy + 22, 64, INK, 800, M, 1);
  const km = lt * 7.7;
  ctx.fillStyle = 'rgba(200,255,46,.15)'; ctx.fillRect(100, 1330, W - 200, 40);
  ctx.fillStyle = LIME; ctx.fillRect(100, 1330, (W - 200) * clamp(km / 23.1), 40);
  iss(100 + (W - 200) * clamp(km / 23.1), 1290, .35, 0);
  txt(`${km.toFixed(1)} km`, W / 2, 1480, 90, INK, 900, M, 1);
  label('a marathon is 42 km. it does that in 5.5 s', W / 2, 1560, MUTED, 32, easeOut(seg(lt, 1.2, 1.6)));
}
function s3(t, lt) {                         // vs a jet airliner
  space(t, .7);
  const k = easeOut(seg(lt, 0, .4));
  headline('30× FASTER', 'than a jet airliner', k, 320);
  const p = seg(lt, .3, 2.6);
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3;
  [880, 1240].forEach(y => { ctx.beginPath(); ctx.moveTo(80, y); ctx.lineTo(W - 80, y); ctx.stroke(); });
  label('JET  900 km/h', 80 + 140, 820, MUTED, 34, k);
  plane(100 + 30 * p, 880, .9, 1);
  label('ISS  28,000 km/h', 80 + 170, 1180, LIME, 34, k);
  speedLines(p, 1200, 1280, '200,255,46');
  iss(lerp(120, W - 140, Math.min(1, p * 1.05)), 1240, .4, 0);
  txt('the jet barely moved', W / 2, 1500, 46, INK, 700, M, easeOut(seg(lt, 1.6, 2)));
}
function route(t, lt, title, sub, from, to, a, b, planeText, mins) {   // shared map shot
  space(t, .6);
  const k = easeOut(seg(lt, 0, .4));
  headline(title, sub, k, 300);
  const p = ease(seg(lt, .4, 1.9));
  ctx.strokeStyle = LIME; ctx.lineWidth = 7; ctx.setLineDash([18, 12]); ctx.beginPath();
  for (let i = 0; i <= 40 * p; i++) { const q = i / 40, x = lerp(a[0], b[0], q), y = lerp(a[1], b[1], q) - Math.sin(q * Math.PI) * 260; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.setLineDash([]);
  [a, b].forEach((pt, i) => { glow(pt[0], pt[1], 40, '200,255,46', i ? easeOut(seg(lt, 1.8, 2.1)) : 1); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(pt[0], pt[1], 10, 0, 6.283); ctx.fill(); });
  label(from, a[0], a[1] + 70, INK, 38, 1); label(to, b[0], b[1] + 70, INK, 38, easeOut(seg(lt, 1.8, 2.1)));
  const q = p, ix = lerp(a[0], b[0], q), iy = lerp(a[1], b[1], q) - Math.sin(q * Math.PI) * 260;
  iss(ix, iy - 30, .3, 0);
  txt(`${(mins * p).toFixed(1)} min`, W / 2, 1420, 110, LIME, 900, M, easeOut(seg(lt, .4, .7)));
  txt(planeText, W / 2, 1520, 44, MUTED, 600, M, easeOut(seg(lt, 1.6, 2)));
}
function s4(t, lt) { route(t, lt, '12 MINUTES', 'London → New York', 'LONDON', 'NEW YORK', [880, 1100], [200, 1060], 'a jet takes ~7 hours', 12.1); }
function s5(t, lt) { route(t, lt, 'UNDER 9 MIN', 'New York → Los Angeles', 'NEW YORK', 'L.A.', [900, 1080], [180, 1140], 'coast to coast', 8.6); }
function s6(t, lt) {                         // one lap of the planet in 90 min
  space(t, .8);
  const k = easeOut(seg(lt, 0, .4));
  headline('90 MINUTES', 'to circle the whole Earth', k, 300);
  const cx = W / 2, cy = 1080, R = 260, OR = 360;
  glow(cx, cy, R + 90, '80,150,255', .5);
  const g = ctx.createRadialGradient(cx - 80, cy - 80, 30, cx, cy, R); g.addColorStop(0, '#4aa0ff'); g.addColorStop(1, '#0b2f66');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(70,150,90,.6)'; ctx.beginPath(); ctx.ellipse(cx - 70, cy - 40, 110, 70, .5, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 90, cy + 80, 70, 110, -.3, 0, 6.283); ctx.fill();
  const p = ease(seg(lt, .2, 2.6)), an = -Math.PI / 2 + p * 6.283;
  ctx.strokeStyle = LIME; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, OR, -Math.PI / 2, an); ctx.stroke();
  iss(cx + Math.cos(an) * OR, cy + Math.sin(an) * OR, .32, an + Math.PI / 2);
  txt(`${Math.round(90 * p)} min`, W / 2, 1600, 110, INK, 900, M, 1);
}
function s7(t, lt) {                         // 16 sunrises a day
  space(t, .6);
  const n = Math.min(16, Math.floor(lt / 2.6 * 16) + 1);
  const sk = (lt * 16 / 2.6) % 1;
  // sunrise over the limb, repeats fast
  earth(t, 2250, 1300, 120);
  glow(W / 2, 950, 420 * (1 - sk * .5), '255,190,90', .9 * (1 - sk));
  flash(.18 * (1 - sk), '255,200,120');
  const k = easeOut(seg(lt, 0, .4));
  txt(`${n}`, W / 2, 560, 260, LIME, 900, M, 1);
  txt('SUNRISES', W / 2, 700, 110, INK, 900, F, k);
  txt('EVERY SINGLE DAY', W / 2, 790, 56, INK, 800, F, k);
  label('one every 90 minutes', W / 2, 870, MUTED, 38, easeOut(seg(lt, .8, 1.2)));
}
function s8(t, lt) {                         // outro, loops into the hook
  space(t, 1, 40); earth(t, 2350, 1500, 260);
  const k = easeOut(seg(lt, .1, .5));
  txt('WOULD YOU', W / 2, 360, 120, INK, 900, F, k);
  txt('RIDE IT?', W / 2, 490, 130, LIME, 900, F, k);
  iss(lerp(W / 2, W + 300, ease(seg(lt, 2.4, 3.6))), 1080, lerp(1.1, .9, seg(lt, 0, 3)), -.08);
  speedLines(seg(lt, 2.2, 3.4), 900, 1300);
  txt('AJENT21 · SCALE #6', W / 2, 1720, 40, INK, 800, M, easeOut(seg(lt, .6, 1)));
}
const SHOTS = [[0, 2.6, s0], [2.6, 5.2, s1], [5.2, 8.0, s2], [8.0, 10.6, s3], [10.6, 13.0, s4], [13.0, 15.4, s5],
  [15.4, 18.4, s6], [18.4, 21.4, s7], [21.4, 25.0, s8]];
window.DURATION = 25;
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.textAlign = 'center';
  const s = SHOTS.find(([a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
  ctx.save(); s[2](t, t - s[0]); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = LIME; ctx.fillRect(0, 0, W * t / window.DURATION, 10);
  vignette(.45); grain(t);
  ctaPill(t, 10.2, 2.6, 'FOLLOW · NEW SCALE DAILY');
  ctx.textAlign = 'left'; ctx.font = `700 30px ${M}`; ctx.fillStyle = 'rgba(244,244,240,.7)'; ctx.fillText('SCALE #6', 40, 70); ctx.textAlign = 'center';
};
</script></body></html>
