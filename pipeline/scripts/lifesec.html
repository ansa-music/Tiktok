<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// SCALE #9 (follow-up to the best performer "Universe in One Year"): zoom into Dec 31, end on "your life".
// 13.8 billion years → 1 year, so 1 second ≈ 437.6 years.
const LIME = '#C8FF2E', INK = '#F4F4F0', MUTED = '#9A9A92';
const YPS = 13.8e9 / 31536000;
// [years ago, label, emoji]
const EV = [
  [7e6, 'Our ancestors split from chimps', '🐒'],
  [3.3e6, 'First stone tools', '🪨'],
  [300000, 'Homo sapiens appears', '🧍'],
  [45000, 'Oldest cave paintings', '🎨'],
  [12000, 'Farming begins', '🌾'],
  [4586, 'The pyramids', '🔺'],
  [2026, 'Year 1 AD', '📜'],
  [57, 'Moon landing', '🌕'],
];
const T0 = 2.4, SEG = 2.2;
window.DURATION = T0 + SEG * EV.length + 6.2;
const pad2 = n => String(n).padStart(2, '0');
function clock(yearsAgo) {
  const s = 86400 - yearsAgo / YPS, whole = Math.floor(s);
  return `${pad2(Math.floor(whole / 3600))}:${pad2(Math.floor(whole / 60) % 60)}:${pad2(whole % 60)}`;
}
const STARS = (() => { const r = rng(12); return Array.from({ length: 300 }, () => ({ x: r() * W, y: r() * H, z: .2 + r() * .8, p: r() * 6 })); })();
function space(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#04030a'); g.addColorStop(1, '#120a16');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  STARS.forEach(s => { ctx.globalAlpha = s.z * (.5 + .5 * Math.sin(t * 2 + s.p)); ctx.fillStyle = '#fff'; ctx.fillRect((s.x + t * 6 * s.z) % W, s.y, 2.2 * s.z, 2.2 * s.z); });
  ctx.globalAlpha = 1;
}
function txt(s, x, y, size, col, weight = 900, fam = '"Inter Display", Inter, sans-serif', a = 1) {
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${fam}`; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function emoji(e, x, y, size, a) { ctx.globalAlpha = a; ctx.font = `${size}px "Noto Color Emoji"`; ctx.fillText(e, x, y); ctx.globalAlpha = 1; }
function bar(frac) {                                   // the last day as a bar, filling to midnight
  const x0 = 90, x1 = W - 90, y = 1500;
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x0, y, x1 - x0, 26);
  ctx.fillStyle = LIME; ctx.fillRect(x0, y, (x1 - x0) * frac, 26);
  ctx.font = '600 30px "JetBrains Mono", monospace'; ctx.fillStyle = MUTED;
  ctx.textAlign = 'left'; ctx.fillText('DEC 31  00:00', x0, y + 70); ctx.textAlign = 'right'; ctx.fillText('MIDNIGHT', x1, y + 70); ctx.textAlign = 'center';
}

window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textAlign = 'center';
  space(t);
  if (t < T0) {                                       // hook: the punchline as a question
    const k = easeOut(seg(t, .05, .45));
    txt('YOUR WHOLE LIFE', W / 2, 640, 110, INK, 900, undefined, k);
    txt('LASTS', W / 2, 760, 110, INK, 900, undefined, k);
    txt('0.07 SECONDS?', W / 2, 900, 130, LIME, 900, undefined, k);
    txt('if the universe were one year', W / 2, 1010, 44, MUTED, 500, '"JetBrains Mono", monospace', easeOut(seg(t, .7, 1.1)));
  } else if (t < T0 + SEG * EV.length) {
    const i = Math.floor((t - T0) / SEG), lt = t - T0 - i * SEG, ev = EV[i];
    const s = 86400 - ev[0] / YPS;
    bar(s / 86400);
    txt('DEC 31', W / 2, 260, 70, MUTED, 800, '"JetBrains Mono", monospace');
    const k = easeOut(seg(lt, 0, .35));
    ctx.save(); ctx.translate(W / 2, 520); const sc = .85 + .15 * k; ctx.scale(sc, sc);
    txt(clock(ev[0]), 0, 0, 150, LIME, 900, '"JetBrains Mono", monospace', k);
    ctx.restore();
    txt(ev[1], W / 2, 660, 64, INK, 800, undefined, k);
    const ago = ev[0] >= 1e6 ? `${(ev[0] / 1e6).toLocaleString('en-US')} million years ago` : `${ev[0].toLocaleString('en-US')} years ago`;
    txt(ago, W / 2, 740, 40, MUTED, 600, '"JetBrains Mono", monospace', k);
    emoji(ev[2], W / 2, 1150, 200, k);
    flash(.3 * clamp(1 - lt * 5));
  } else {                                            // payoff: a human life in the last blink
    const lt = t - T0 - SEG * EV.length;
    bar(1);
    const k = easeOut(seg(lt, .1, .5)), k2 = easeOut(seg(lt, 1.3, 1.8)), k3 = easeOut(seg(lt, 3, 3.5));
    txt('A 30-YEAR LIFE?', W / 2, 520, 100, INK, 900, undefined, k);
    ctx.save(); ctx.translate(W / 2, 760); const sc = 1 + .06 * Math.sin(lt * 8) * k2; ctx.scale(sc, sc);
    txt('0.07 s', 0, 0, 220, LIME, 900, '"JetBrains Mono", monospace', k2);
    ctx.restore();
    txt('Shorter than a blink. 👁️', W / 2, 900, 58, INK, 800, undefined, k2);
    txt('Make it count.', W / 2, 1120, 72, '#ff6a4a', 900, undefined, k3);
    txt('AJENT21 · SCALE #9', W / 2, 1720, 38, INK, 800, '"JetBrains Mono", monospace', easeOut(seg(lt, 4, 4.4)));
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctaPill(t, 8.6, 2.6, 'FOLLOW · NEW SCALE DAILY');
  ctx.textAlign = 'left'; ctx.font = '700 30px "JetBrains Mono", monospace'; ctx.fillStyle = 'rgba(244,244,240,.7)'; ctx.fillText('SCALE #9', 40, 70); ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = LIME; ctx.fillRect(0, 0, W * t / window.DURATION, 10);
  vignette(.45); grain(t);
};
</script></body></html>
