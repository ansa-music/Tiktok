<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=JetBrains+Mono:wght@600;700;800&display=block">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script>
<script>
// Scale series #9: do all the planets fit between Earth and the Moon? Drawn to scale, 1 px = 300 km.
// Equatorial diameters, NASA Planetary Fact Sheet (nssdc.gsfc.nasa.gov/planetary/factsheet):
// Jupiter 142,984  Saturn 120,536  Uranus 51,118  Neptune 49,528  Venus 12,104  Mars 6,792  Mercury 4,879 km
// sum = 387,941 km (rings excluded; mean diameters would give 380,010, so equatorial is the strict case).
// Earth radius 6,371 km, Moon radius 1,737 km (NASA fact sheets).
// Earth–Moon centre-to-centre: average 384,400 km, apogee ~405,500 km (NASA Moon fact sheet; apogee ranges 404,000–406,700).
// Surface-to-surface gap: average 384,400 - 6,371 - 1,737 = 376,292 km -> planets too tall by 387,941 - 376,292 = 11,649 km (~11,600).
// At apogee: 405,500 - 8,108 = 397,392 km -> they fit with 397,392 - 387,941 = 9,451 km to spare (~9,400).
// Even at the closest apogee (404,000): 395,892 -> still fits by 7,951 km.
const LIME = '#C8FF2E', INK = '#F4F4F0', MUTED = '#9A9A92', RED = '#ff4d5e';
const KM = 300, EARTH_TOP = 1760, EARTH_R = 6371 / KM, MOON_R = 1737 / KM;
const GAP_AVG = 376292, GAP_APO = 397392, TOTAL = 387941;
// [name, diameter km, colours, has rings]
const PL = [
  ['JUPITER', 142984, ['#f3d9b1', '#c99a6b', '#8a5a3c'], 0],
  ['SATURN', 120536, ['#f5e6b8', '#d9b877', '#9c7d45'], 1],
  ['URANUS', 51118, ['#d4f6f7', '#8fdde3', '#4aa7b5'], 0],
  ['NEPTUNE', 49528, ['#9fc0ff', '#4b72e0', '#22399a'], 0],
  ['VENUS', 12104, ['#fff3cf', '#e8c77d', '#b58a3e'], 0],
  ['MARS', 6792, ['#ffb08a', '#d4593a', '#8c2f1c'], 0],
  ['MERCURY', 4879, ['#e6e6e6', '#a8a8a8', '#6b6b6b'], 0],
];
const T0 = 1.6, STEP = 1.6;                      // planet i lands at T0 + i*STEP
const T_OVER = T0 + 7 * STEP, T_APO = T_OVER + 3, T_FIT = T_APO + 1.6, T_END = 23;
const STARS = (() => { const r = rng(3); return Array.from({ length: 220 }, () => ({ x: r() * W, y: r() * H, s: .5 + r() * 2, p: r() * 6 })); })();
const fmt = n => Math.round(n).toLocaleString('en-US');

function ball(x, y, r, col, rings, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  if (rings) { ctx.strokeStyle = 'rgba(230,210,160,.55)'; ctx.lineWidth = r * .16; ctx.beginPath(); ctx.ellipse(x, y, r * 2.2, r * .42, -.12, Math.PI, Math.PI * 2); ctx.stroke(); }
  const g = ctx.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
  g.addColorStop(0, col[0]); g.addColorStop(.6, col[1]); g.addColorStop(1, col[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  if (r > 60) { ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); ctx.globalAlpha = a * .18; ctx.fillStyle = col[2];
    for (let i = -3; i <= 3; i++) ctx.fillRect(x - r, y + i * r * .26 - r * .05, r * 2, r * .1); ctx.restore(); }
  if (rings) { ctx.strokeStyle = 'rgba(230,210,160,.75)'; ctx.lineWidth = r * .16; ctx.beginPath(); ctx.ellipse(x, y, r * 2.2, r * .42, -.12, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
}
function label(txt, x, y, col = INK, size = 34, align = 'left') {
  ctx.textAlign = align; ctx.font = `800 ${size}px "JetBrains Mono", monospace`; ctx.fillStyle = col; ctx.fillText(txt, x, y); ctx.textAlign = 'center';
}

window.DURATION = 26;
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textAlign = 'center';
  ctx.fillStyle = '#05060b'; ctx.fillRect(0, 0, W, H);
  STARS.forEach(s => { ctx.globalAlpha = .35 + .35 * Math.sin(t * 2 + s.p); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); }); ctx.globalAlpha = 1;
  // camera punch on every landing keeps the picture moving
  let punch = 0; for (let i = 0; i < 7; i++) { const d = t - (T0 + i * STEP + .5); if (d > 0 && d < .25) punch = Math.max(punch, 1 - d / .25); }
  ctx.save(); camera(1 + .012 * punch, 0, 0, 10 * punch, t);
  // Moon: average distance, then slides out to apogee
  const apoK = ease(seg(t, T_APO, T_APO + 1.4));
  const moonBottom = EARTH_TOP - lerp(GAP_AVG, GAP_APO, apoK) / KM, moonY = moonBottom - MOON_R;
  const earthY = EARTH_TOP + EARTH_R;
  // measuring line
  const lk = easeOut(seg(t, 0, 1));
  ctx.strokeStyle = 'rgba(200,255,46,.5)'; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
  ctx.beginPath(); ctx.moveTo(870, EARTH_TOP); ctx.lineTo(870, lerp(EARTH_TOP, moonBottom, lk)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = LIME; ctx.fillRect(850, EARTH_TOP - 2, 40, 4); if (lk > .98) ctx.fillRect(850, moonBottom - 2, 40, 4);
  // planets drop in and stack
  let top = EARTH_TOP, sum = 0;
  PL.forEach((p, i) => {
    const land = T0 + i * STEP + .5, r = p[1] / 2 / KM;
    const k = easeOut(seg(t, T0 + i * STEP, land)); if (k <= 0) return;
    const yRest = top - r; top -= 2 * r; sum += p[1] * clamp((t - land + .5) / .5);
    ball(W / 2 - 60, lerp(-300, yRest, k), r, p[2], p[3], 1);
    if (r * 2 > 60 && k > .9) label(p[0], W / 2 - 60, yRest + 12, 'rgba(10,10,12,.75)', 30, 'center');
    else if (k > .9) {                           // tiny planets: fanned labels with leader lines so they don't overlap
      const j = i - 4, ly = EARTH_TOP - 1180 + 70 - j * 60, lx = W / 2 + 90;
      ctx.strokeStyle = 'rgba(244,244,240,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W / 2 - 60 + r + 4, yRest); ctx.lineTo(lx - 10, ly - 10); ctx.stroke();
      label(p[0], lx, ly, INK, 30);
    }
  });
  // overflow: the top of the stack pokes past the Moon
  if (t > T_OVER && t < T_APO + .8) {
    const a = easeOut(seg(t, T_OVER, T_OVER + .4)) * (1 - seg(t, T_APO + .2, T_APO + .8));
    ctx.fillStyle = `rgba(255,77,94,${.35 * a})`; ctx.fillRect(0, top, W, moonBottom - top);
    ctx.fillStyle = `rgba(255,77,94,${a})`; ctx.fillRect(0, moonBottom - 2, W, 4);
  }
  if (t > T_FIT) { const a = easeOut(seg(t, T_FIT, T_FIT + .4)); ctx.fillStyle = `rgba(200,255,46,${.25 * a})`; ctx.fillRect(0, moonBottom, W, top - moonBottom); }
  // Earth and Moon (true size at this scale, glow so they read)
  [[earthY, EARTH_R, ['#bfe3ff', '#2f7ad9', '#0b2e6b'], 'EARTH', '60,140,255'], [moonY, MOON_R, ['#ffffff', '#cfcfcf', '#8a8a8a'], 'MOON', '255,255,255']].forEach(([y, r, col, nm, gl]) => {
    const g = ctx.createRadialGradient(W / 2 - 60, y, r, W / 2 - 60, y, r * 5); g.addColorStop(0, `rgba(${gl},.5)`); g.addColorStop(1, `rgba(${gl},0)`);
    ctx.fillStyle = g; ctx.fillRect(W / 2 - 60 - r * 5, y - r * 5, r * 10, r * 10);
    ball(W / 2 - 60, y, r, col, 0); label(nm, W / 2 - 60 - r - 24, y + 12, INK, 32, 'right');
  });
  ctx.restore();

  // header: running totals
  ctx.fillStyle = 'rgba(5,6,11,.7)'; ctx.fillRect(0, 96, W, 104);
  const gapNow = lerp(GAP_AVG, GAP_APO, apoK);
  label('GAP', 40, 140, MUTED, 30); label(fmt(gapNow) + ' km', 40, 182, INK, 38);
  label('PLANETS', W - 40, 140, MUTED, 30, 'right');
  label(fmt(sum) + ' km', W - 40, 182, sum > gapNow ? RED : LIME, 38, 'right');
  // headline per beat
  let h1 = '', h2 = '', hc = INK;
  if (t < T0 + 1.2) { h1 = 'Can EVERY planet fit'; h2 = 'between Earth and Moon?'; }
  else if (t < T_OVER) { h1 = 'Stacking them up…'; h2 = 'drawn to scale'; hc = LIME; }
  else if (t < T_APO) { h1 = 'Too tall by 11,600 km!'; h2 = 'at the average distance'; hc = RED; }
  else if (t < T_FIT) { h1 = 'But the orbit is an oval.'; h2 = 'At its farthest point…'; }
  else { h1 = 'THEY FIT.'; h2 = 'with ~9,400 km to spare'; hc = LIME; }
  const beatStart = t < T0 + 1.2 ? 0 : t < T_OVER ? T0 + 1.2 : t < T_APO ? T_OVER : t < T_FIT ? T_APO : T_FIT;
  const hk = easeOut(seg(t, beatStart, beatStart + .35));
  ctx.save(); ctx.globalAlpha = hk; ctx.translate(W / 2, 300); ctx.scale(.92 + .08 * hk, .92 + .08 * hk);
  ctx.font = '900 110px Inter, sans-serif'; const fs = Math.min(110, 110 * 980 / ctx.measureText(h1).width);
  ctx.fillStyle = hc; ctx.font = `900 ${fs}px Inter, sans-serif`; ctx.fillText(h1, 0, 0);
  ctx.fillStyle = INK; ctx.font = '800 50px Inter, sans-serif'; ctx.fillText(h2, 0, 76);
  ctx.restore();
  // end card, no fade to black: the loop restarts on the empty gap
  if (t > T_END) { const a = easeOut(seg(t, T_END, T_END + .5)); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,10,12,.78)'; ctx.beginPath(); ctx.roundRect(110, 1180, W - 220, 300, 30); ctx.fill();
    ctx.fillStyle = LIME; ctx.font = '900 92px Inter, sans-serif'; ctx.fillText('AJENT21', W / 2, 1300);
    ctx.fillStyle = INK; ctx.font = '700 38px "JetBrains Mono", monospace'; ctx.fillText('Did you think they fit?', W / 2, 1380);
    ctx.fillStyle = MUTED; ctx.font = '600 32px "JetBrains Mono", monospace'; ctx.fillText('FOLLOW FOR MORE SCALE', W / 2, 1436); ctx.globalAlpha = 1; }
  // progress bar + tags
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = LIME; ctx.fillRect(0, 0, W * t / window.DURATION, 10);
  vignette(.3); grain(t);
  ctaPill(t, 10.6, 2.6, 'FOLLOW · NEW SCALE DAILY');
  ctx.textAlign = 'left'; ctx.font = '700 30px "JetBrains Mono", monospace'; ctx.fillStyle = 'rgba(244,244,240,.8)'; ctx.fillText('SCALE #9', 40, 70);
  ctx.textAlign = 'right'; ctx.fillText('1 px = 300 km', W - 40, 70); ctx.textAlign = 'center';
};
</script></body></html>
